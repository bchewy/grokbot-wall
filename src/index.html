<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grok Bot · Check-in Wall</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<style>
  :root { --accent:#4F9CF9; --fg:#ececf1; --dim:#8a8f9a; --line:#2a2d35; --bg:#06070a; --mono:"JetBrains Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace; }
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--mono);color:var(--fg)}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  #gl{display:block}
  button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);padding:6px 12px;cursor:pointer;letter-spacing:.04em;text-transform:uppercase;font-size:12px}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
  button.danger:hover{border-color:#ff4d4d;color:#ff7b7b}
  input,select{font:inherit;color:var(--fg);background:#0b0d12;border:1px solid var(--line);padding:8px 10px;outline:none;font-size:13px}
  input:focus,select:focus{border-color:var(--accent)}
  /* desk console */
  #desk{position:fixed;inset:20px;background:rgba(6,7,10,.96);border:1px solid var(--accent);display:flex;flex-direction:column;font-size:13px;line-height:1.5;box-shadow:0 0 0 1px #000,0 40px 120px rgba(0,0,0,.85);z-index:10}
  .dk-head{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
  .dk-title{color:var(--accent);font-weight:600;letter-spacing:.08em}
  .dk-sub{color:var(--dim);margin-left:8px}
  .dk-spacer{flex:1}
  .dk-body{display:flex;flex:1;min-height:0}
  .dk-left{width:46%;display:flex;flex-direction:column;border-right:1px solid var(--line)}
  .dk-left input{margin:12px 14px;flex:none}
  #dk-list{overflow:auto;flex:1;padding:0 6px 12px}
  .g-row{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:7px 10px;border:1px solid transparent;cursor:pointer}
  .g-row:hover{background:#0f1218}
  .g-row.sel{border-color:var(--accent);background:#0f1420}
  .g-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .g-email{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .badge.in{border-color:var(--accent);color:var(--accent)}
  .badge.code{color:#fff;border-color:#3a3f4a}
  .badge.bad{border-color:#ff4d4d;color:#ff7b7b}
  .d-mail{border:1px solid var(--line);padding:12px 16px;margin:12px 0;display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:#c9ccd4}
  .d-mail .p{color:var(--accent);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .dk-right{flex:1;overflow:auto;padding:22px 26px}
  .dk-empty{color:var(--dim)}
  .d-name{font-size:26px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}
  .d-meta{color:var(--dim);margin-bottom:18px}
  .d-code{border:1px solid var(--line);padding:16px 18px;margin:12px 0;display:flex;gap:22px;align-items:flex-start}
  .d-code img{image-rendering:pixelated;width:168px;height:168px;background:#fff;flex:none}
  .d-code .c{font-size:22px;font-weight:600;letter-spacing:.02em;color:#fff;word-break:break-all}
  .d-code .u{color:var(--dim);font-size:12px;word-break:break-all;margin:6px 0 12px}
  .d-code .p{color:var(--accent);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .hint{color:var(--dim);font-size:12px;margin-top:20px;line-height:1.7}
  kbd{border:1px solid var(--line);padding:0 5px;color:#fff}
  /* modal */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:20}
  .md-box{width:min(560px,92vw);background:#07080c;border:1px solid var(--accent);padding:22px 24px;font-size:13px;max-height:88vh;overflow:auto}
  .md-box h3{margin:0 0 14px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
  .field{display:flex;flex-direction:column;gap:6px;margin:10px 0}
  .field label{color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  .field input,.field select{width:100%;box-sizing:border-box}
  #toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:#0b0d12;border:1px solid var(--accent);padding:10px 16px;font-size:13px;z-index:30;pointer-events:none}
  #err{position:fixed;top:0;left:0;right:0;background:#3a0b0b;color:#ffb3b3;padding:8px 14px;font-size:12px;z-index:40;white-space:pre-wrap}
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas></div>

<div id="desk" hidden>
  <div class="dk-head">
    <span class="dk-title">▌ DESK CONSOLE</span><span class="dk-sub" id="dk-mode"></span>
    <span class="dk-spacer"></span>
    <button id="dk-manual">+ manual check-in</button>
    <button id="dk-export">export csv</button>
    <button id="dk-settings">settings</button>
    <button id="dk-close">close [esc]</button>
  </div>
  <div class="dk-body">
    <div class="dk-left">
      <input id="dk-q" placeholder="search name or email…" autocomplete="off" spellcheck="false">
      <div id="dk-list"></div>
    </div>
    <div class="dk-right" id="dk-detail"><div class="dk-empty">select a guest to see their credit code</div></div>
  </div>
</div>
<div id="modal" hidden><div class="md-box" id="md-box"></div></div>
<div id="toast" hidden></div>
<div id="err" hidden></div>

<script src="vendor/three.min.js" data-inline></script>
<script src="vendor/qrcode.min.js" data-inline></script>
<script>
'use strict';
// =====================================================================
//  CONFIG & DATA
// =====================================================================
const CODES = /*@codes*/null; // {A:[{code,url}],B:[{code,url}],labels:{A,B}}
const params = new URLSearchParams(location.search);
const RAW = params.has('raw');
const WALL_KEY = params.get('key') || '';
const api = (path, init = {}) => fetch(path, { ...init, headers: { ...(init.headers || {}), ...(WALL_KEY ? { 'x-wall-key': WALL_KEY } : {}) } });
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pad2 = n => String(n).padStart(2, '0');
const pad3 = n => String(n).padStart(3, '0');
const nowS = () => performance.now() / 1000;
const fmtHM = iso => { const d = new Date(iso); return isNaN(d) ? '--:--' : `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const hex2rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixRgb = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgb2hex = c => '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
// Grok Bot brand colours. `ui` is the accent used for text when the body colour itself is too bright/dull.
const BRAND = [
  { name: 'WHITE',   hex: '#FFFFFF', ui: '#0B72E1' },
  { name: 'BROWN',   hex: '#7B4B2A', ui: '#FFA100' },
  { name: 'RED',     hex: '#E4232F' },
  { name: 'ORANGE',  hex: '#FF5A00' },
  { name: 'AMBER',   hex: '#FFA100' },
  { name: 'GREEN',   hex: '#00A65A' },
  { name: 'TEAL',    hex: '#00A88E' },
  { name: 'BLUE',    hex: '#0B72E1' },
  { name: 'PURPLE',  hex: '#8A4CF0' },
  { name: 'MAGENTA', hex: '#E5218C' },
  { name: 'GREY',    hex: '#6E6E6E', ui: '#8A4CF0' },
].map(c => { const main = c.ui || c.hex; const rgb = hex2rgb(main); const lightRgb = mixRgb(rgb, [255, 255, 255], 0.45), deepRgb = mixRgb(rgb, [0, 0, 0], 0.5); return { ...c, main, rgb, lightRgb, deepRgb, light: rgb2hex(lightRgb), deep: rgb2hex(deepRgb) }; });
const CHROMA = ['RED', 'ORANGE', 'AMBER', 'GREEN', 'TEAL', 'BLUE', 'PURPLE', 'MAGENTA'].map(n => BRAND.findIndex(c => c.name === n));
const WHITE = [240, 240, 244], GREY = [128, 134, 148], DIM = [66, 70, 82], BLACK = [0, 0, 0];
let colorIdx = 0, celebColor = 6;           // white body + blue UI to start; check-ins walk the colour wheel
const accent = () => BRAND[colorIdx];
const bodyHex = () => BRAND[colorIdx].hex;
function bgTriple() {
  const k = Math.max(0, CHROMA.indexOf(BRAND.findIndex(c => c.hex === accent().main)));
  return [BRAND[CHROMA[k]], BRAND[CHROMA[(k + 1) % 8]], BRAND[CHROMA[(k + 7) % 8]]].map(c => new THREE.Color(c.main));
}

const DEMO_NAMES = ['Wei Lin Tan', 'Arjun Menon', 'Sofia Reyes', 'Kenji Watanabe', 'Priya Nair', 'Marcus Lim', 'Aisha Rahman', 'Daniel Ng', 'Chloe Zhang', 'Ravi Kumar', 'Hana Yusof', 'Jonas Berg', 'Mei Ling Chua', 'Tom Okafor', 'Nadia Hussain', 'Ethan Goh', 'Lucia Fernandez', 'Ibrahim Salleh', 'Grace Koh', 'Leon Müller', 'Sarah Teo', 'Vikram Shah', 'Yuki Tanaka', 'Ben Carter', 'Amira Zain', 'Felix Ong', 'Nur Aisyah', 'Oscar Lee', 'Zara Ahmed', 'Kai Wong', 'Elena Petrova', 'Samuel Choo', 'Ines Duarte', 'Rohan Iyer', 'Jade Lau', 'Noah Kim', 'Farah Ismail', 'Liam Tan', 'Anya Bose', 'Dylan Foo'];

// =====================================================================
//  APP STATE
// =====================================================================
const app = {
  mode: 'boot',            // boot | demo | luma | manual
  server: false, luma: false,
  eventId: null, eventName: '', eventStart: null,
  total: 0,                // approved guests
  guests: new Map(),       // key -> {key,id,name,email,checkedInAt,approval}
  alloc: new Map(),        // key -> allocation
  feed: [],                // allocations newest first
  config: { eventId: null, poolMode: 'A-then-B', pollMs: 5000 },
  labels: (CODES && CODES.labels) || { A: 'Pool A', B: 'Pool B' },
  poolTotals: { A: CODES ? CODES.A.length : 0, B: CODES ? CODES.B.length : 0 },
  lastSync: 0, syncing: false, error: '', initial: true, persist: false, email: null, lastWebhookAt: null, serverPolls: false, failedSyncs: 0, headline: '',
  dirty: true,
};
const celeb = { active: null, queue: [], t0: 0, dur: 5.2, flash: 0 };

function codeIndex(cd) {
  if (cd.n) return cd.n;
  const pool = CODES && CODES[cd.pool];
  if (!pool) return 0;
  const i = pool.findIndex(c => c.code === cd.code);
  return i < 0 ? 0 : i + 1;
}
// public-screen privacy: 'Ada Lovelace' → 'Ada L.' (the desk still shows full names)
const publicName = n => { const p = String(n || '').trim().split(/\s+/).filter(Boolean); return p.length > 1 ? `${p[0]} ${p[p.length - 1][0].toUpperCase()}.` : (p[0] || 'Guest'); };
function codeTag(a) { return a.codes && a.codes.length ? a.codes.map(cd => `${cd.pool}#${pad3(codeIndex(cd))}`).join('+') : 'NONE'; }
const mailCounts = () => { let sent = 0, failed = 0; for (const a of app.alloc.values()) { const st = a.mail && a.mail.status; if (st === 'sent' || st === 'dry') sent++; else if (st === 'failed') failed++; } return { sent, failed }; };
function usedIn(pool) { let n = 0; for (const a of app.alloc.values()) for (const c of a.codes) if (c.pool === pool) n++; return n; }
function creditsLeft() { return (app.poolTotals.A - usedIn('A')) + (app.poolTotals.B - usedIn('B')); }

// ---- persistence (server first, localStorage fallback) ----
const LS = 'grokbot.state.v1';
function loadLocal() { try { const s = JSON.parse(localStorage.getItem(LS) || 'null'); if (s) { (s.allocations || []).forEach(a => app.alloc.set(a.key, a)); Object.assign(app.config, s.config || {}); } } catch {} }
function saveLocal() { try { localStorage.setItem(LS, JSON.stringify({ allocations: [...app.alloc.values()], config: app.config })); } catch {} }

function localAllocate(body) {
  const key = body.key.toLowerCase();
  if (app.alloc.has(key)) return app.alloc.get(key);
  const used = new Set(); for (const a of app.alloc.values()) for (const c of a.codes) used.add(c.code);
  const pick = pool => { const c = ((CODES && CODES[pool]) || []).find(c => !used.has(c.code)); return c ? { pool, code: c.code, url: c.url } : null; };
  const codes = [];
  if (app.config.poolMode === 'both') { for (const p of ['A', 'B']) { const c = pick(p); if (c) codes.push(c); } }
  else for (const p of (app.config.poolMode === 'B-then-A' ? ['B', 'A'] : ['A', 'B'])) { const c = pick(p); if (c) { codes.push(c); break; } }
  return { key, name: body.name || '', email: body.email || '', checkedInAt: body.checkedInAt || null, source: body.source || 'luma', at: new Date().toISOString(), codes };
}

async function ensureAllocated(guest, { celebrate }) {
  const key = guest.key.toLowerCase();
  if (app.alloc.has(key)) return app.alloc.get(key);
  const body = { key, name: guest.name, email: guest.email, checkedInAt: guest.checkedInAt, source: guest.source || 'luma' };
  let a;
  if (app.persist) {
    const r = await api('/allocate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('allocate failed ' + r.status);
    a = (await r.json()).allocation;
  } else { a = localAllocate(body); }
  if (app.alloc.has(key)) return app.alloc.get(key);
  addAllocation(a, celebrate);
  if (!app.persist && app.mode !== 'demo') saveLocal();
  return a;
}
function addAllocation(a, celebrate) {
  app.alloc.set(a.key, a);
  app.feed.unshift(a);
  app.feed.sort((x, y) => new Date(y.checkedInAt || y.at) - new Date(x.checkedInAt || x.at));
  if (celebrate) { celeb.queue.push(a); }
  app.dirty = true;
}
async function pushConfig(patch) {
  Object.assign(app.config, patch);
  if (app.persist) await api('/config', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(patch) }).catch(() => {});
  else if (app.mode !== 'demo') saveLocal();
}

// =====================================================================
//  LUMA
// =====================================================================
async function lumaGet(path, q) {
  const u = new URL('/luma' + path, location.origin);
  Object.entries(q || {}).forEach(([k, v]) => v != null && u.searchParams.set(k, v));
  const r = await api(u);
  if (!r.ok) { let m = ''; try { m = (await r.json()).message || ''; } catch {} throw new Error(`Luma ${r.status} ${m}`); }
  return r.json();
}
function normGuest(e) {
  const tickets = e.event_tickets || [];
  const ci = e.checked_in_at || tickets.map(t => t.checked_in_at).filter(Boolean).sort()[0] || null;
  const name = e.user_name || [e.user_first_name, e.user_last_name].filter(Boolean).join(' ') || e.user_email || 'Guest';
  return { key: String(e.user_email || e.user_id || e.id).toLowerCase(), id: e.id, name, email: e.user_email || '', checkedInAt: ci, approval: e.approval_status, source: 'luma' };
}
async function resolveEvent() {
  const forced = params.get('event') || app.config.eventId;
  if (forced) { const ev = await lumaGet('/v1/events/get', { event_id: forced }); return ev.event || ev; }
  const after = new Date(Date.now() - 18 * 3600e3).toISOString();
  const j = await lumaGet('/v1/calendars/events/list', { after, pagination_limit: 10, sort_column: 'start_at', sort_direction: 'asc' });
  const list = (j.entries || []).map(e => e.event || e);
  if (!list.length) throw new Error('No upcoming events on this calendar');
  return list[0];
}
async function listEvents() {
  const after = new Date(Date.now() - 7 * 86400e3).toISOString();
  const j = await lumaGet('/v1/calendars/events/list', { after, pagination_limit: 25, sort_column: 'start_at', sort_direction: 'asc' });
  return (j.entries || []).map(e => e.event || e);
}
let fullRefreshAt = 0;
async function syncLuma() {
  if (app.syncing || !app.eventId) return;
  app.syncing = true;
  try {
    const full = Date.now() - fullRefreshAt > 60_000;
    let cursor = null, pages = 0, stop = false;
    if (full) app.total = 0;
    do {
      const j = await lumaGet('/v1/events/guests/list', { event_id: app.eventId, approval_status: 'approved', pagination_limit: 100, sort_column: 'checked_in_at', sort_direction: 'desc nulls last', pagination_cursor: cursor });
      for (const e of j.entries || []) {
        const g = normGuest(e);
        app.guests.set(g.key, g);
        if (full) app.total++;
        if (g.checkedInAt) { await ensureAllocated(g, { celebrate: !app.initial }); }
        else if (!full) stop = true;
      }
      cursor = j.next_cursor; pages++;
      if (!j.has_more || stop || pages > 30) break;
    } while (cursor);
    if (full) fullRefreshAt = Date.now();
    app.lastSync = Date.now(); app.error = ''; app.initial = false; app.dirty = true;
  } catch (e) { app.error = e.message; }
  finally { app.syncing = false; }
}
async function syncState() {
  if (!app.persist) return;
  try {
    const r = await api('/state'); if (!r.ok) throw new Error('state ' + r.status);
    const s = await r.json(); app.failedSyncs = 0;
    app.labels = s.labels || app.labels; app.poolTotals = s.pools || app.poolTotals;
    if (app.serverPolls && s.luma) {
      if (s.luma.event) { app.eventId = s.luma.event.id; app.eventName = s.luma.event.name || ''; }
      app.total = Math.max(s.luma.total || 0, app.feed.length); app.lastSync = s.luma.lastSync || app.lastSync; app.error = s.luma.error || '';
    }
    if (s.lastWebhookAt && s.lastWebhookAt !== app.lastWebhookAt) { app.lastWebhookAt = s.lastWebhookAt; if (app.mode === 'luma' && !app.initial) syncLuma(); }
    Object.assign(app.config, s.config || {});
    const serverKeys = new Set((s.allocations || []).map(a => a.key));
    for (const k of [...app.alloc.keys()]) if (!serverKeys.has(k)) { app.alloc.delete(k); const i = app.feed.findIndex(f => f.key === k); if (i >= 0) app.feed.splice(i, 1); app.dirty = true; }
    for (const a of s.allocations || []) {
      const cur = app.alloc.get(a.key);
      if (cur) { if (JSON.stringify(cur.mail || null) !== JSON.stringify(a.mail || null)) { cur.mail = a.mail; app.dirty = true; } continue; }
      if (!app.alloc.has(a.key)) {
        const recent = Date.now() - new Date(a.at).getTime() < 45_000;
        addAllocation(a, !app.initial && recent);
        if (!app.guests.has(a.key)) app.guests.set(a.key, { key: a.key, name: a.name, email: a.email, checkedInAt: a.checkedInAt || a.at, source: a.source });
      }
    }
  } catch { app.failedSyncs++; }
}

// =====================================================================
//  DEMO
// =====================================================================
let demoTimer = 0;
function seedDemo() {
  DEMO_NAMES.forEach((n, i) => { const key = n.toLowerCase().replace(/[^a-z]+/g, '.') + '@example.com'; app.guests.set(key, { key, id: 'demo' + i, name: n, email: key, checkedInAt: null, approval: 'approved', source: 'luma' }); });
  app.total = DEMO_NAMES.length; app.eventName = 'Grok Bot Meetup (demo)';
}
function demoCheckIn() {
  const pool = [...app.guests.values()].filter(g => !g.checkedInAt);
  if (!pool.length) return;
  const g = pool[Math.floor(Math.random() * pool.length)];
  g.checkedInAt = new Date().toISOString();
  ensureAllocated(g, { celebrate: true });
}
function scheduleDemo() {
  clearTimeout(demoTimer);
  if (params.has('noauto')) return;
  demoTimer = setTimeout(() => { demoCheckIn(); scheduleDemo(); }, 7000 + Math.random() * 6000);
}

// =====================================================================
//  TERMINAL GRID (glyph atlas + text layer)
// =====================================================================
const FONT = '"JetBrains Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace';
let GLYPHS = ' '; for (let i = 33; i < 127; i++) GLYPHS += String.fromCharCode(i);
GLYPHS += '─│┌┐└┘├┤┬┴┼░▒▓█▀▄▌▐▏▕●○◆◇■□▲▼►◄★✓✗→←↑↓·•…×ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÑÒÓÔÕÖØÙÚÛÜÝßàáâãäåæçèéêëìíîïñòóôõöøùúûüýÿ';
const GI = new Map(); [...GLYPHS].forEach((ch, i) => GI.set(ch, i));
const gi = ch => { const v = GI.get(ch); return v === undefined ? GI.get('?') : v; };
const RAMP = " .'`^\",:;Il!i~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";

function buildAtlas(tw, th) {
  const c = document.createElement('canvas'); c.width = 16 * tw; c.height = 16 * th;
  const x = c.getContext('2d');
  x.fillStyle = '#000'; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = '#fff'; x.strokeStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = `${Math.round(th * 0.86)}px ${FONT}`;
  const lw = Math.max(1, Math.round(th * 0.075)); x.lineWidth = lw; x.lineCap = 'butt';
  const line = (a, b, c2, d) => { x.beginPath(); x.moveTo(a, b); x.lineTo(c2, d); x.stroke(); };
  for (let i = 0; i < GLYPHS.length; i++) {
    const ch = GLYPHS[i]; const ox = (i % 16) * tw, oy = Math.floor(i / 16) * th; const cx = ox + tw / 2, cy = oy + th / 2;
    const dot = () => x.fillRect(cx - lw / 2, cy - lw / 2, lw, lw);
    switch (ch) {

    const w = Math.max(bw, l1.length, l3.length) + 6, x0 = Math.max(0, Math.floor((cols - w) / 2));
    fillRect(x0, r, w, L.bannerH, ' ', BLACK, 64);
    const cx = x0 + 3;
    typed(cx, r + 1, l1, A.lightRgb, tt * 45, true, w - 6);
    const chars = Math.floor((tt - 0.3) * 10);
    if (chars > 0) bigText(x0 + Math.floor((w - bw) / 2), r + 2, f.text.slice(0, chars), f.wide, A.rgb);
    typed(cx, r + 8, l3, codes ? WHITE : [255, 120, 120], (tt - 1.1) * 60, true, w - 6);
    const fadeIn = celeb.dur - 0.7;
    if (tt > fadeIn) dissolve(x0, r + 1, w, L.bannerH - 1, clamp((tt - fadeIn) / 0.7, 0, 1) * 0.9);

    const line = idleI % 2 ? IDLE_LINES[idleI % IDLE_LINES.length] : STYLES[morph.cur].line;
    const n = Math.min(line.length, Math.floor(tt * 30));
    const shown = '> ' + line.slice(0, n);
    fillRect(1, rows - 3, shown.length + 3, 1, ' ', BLACK, 64);
    put(2, rows - 3, shown, GREY);
    if ((Math.floor(t * 2) % 2) === 0) put(2 + shown.length, rows - 3, '▌', GREY);
  }
}

// =====================================================================
//  CELEBRATION + LOOP
// =====================================================================
function updateCelebration(t, L) {
  if (!celeb.active && celeb.queue.length) {
    celeb.active = celeb.queue.shift(); celeb.t0 = t;
    celeb.dur = celeb.queue.length > 6 ? 2.2 : celeb.queue.length > 2 ? 3.2 : 5.4;
    celebColor = (celebColor + 1) % CHROMA.length; colorIdx = CHROMA[celebColor]; celeb.flash = 0.9;
    anim.spinT0 = t; anim.kickT0 = t; anim.wowT0 = t;
    setStyle(0, t, 0.55); morph.nextAt = t + celeb.dur + 6;
    const rad = bot.scale.x || 1;
    burst(220, bot.position, rad, accent());
    setTimeout(() => burst(120, bot.position, rad, accent()), 320);
    document.documentElement.style.setProperty('--accent', accent().main);
    app.dirty = true;
  }
  if (celeb.active && t - celeb.t0 > celeb.dur) { celeb.active = null; app.dirty = true; }
  if (!celeb.active && !morph.hold && t > morph.nextAt) {
    setStyle(morph.cur + 1, t, 1.4); morph.nextAt = t + 12 + Math.random() * 5;
    colorIdx = (colorIdx + 1) % BRAND.length; document.documentElement.style.setProperty('--accent', accent().main);
  }
}
let last = nowS();
function frame() {
  requestAnimationFrame(frame);
  const t = nowS(); const dt = Math.min(0.05, t - last); last = t;
  const L = layout();
  updateCelebration(t, L);
  updateWorld(t, dt, L);
  drawUI(t, L);
  glyphTex.needsUpdate = true; colorTex.needsUpdate = true;
  if (RAW) { renderer.setRenderTarget(null); renderer.render(bgScene, cam); renderer.autoClear = false; renderer.render(scene, cam); renderer.autoClear = true; }
  else {
    renderer.setClearColor(0x000000, 1); renderer.setRenderTarget(rtFine); renderer.render(bgScene, cam);
    renderer.setClearColor(0x000000, 0); renderer.setRenderTarget(rt); renderer.render(scene, cam);
    renderer.setRenderTarget(null); renderer.render(compScene, compCam);
  }
  if (app.dirty && !desk.hidden) renderDesk();
}

// =====================================================================
//  DESK CONSOLE (DOM)
// =====================================================================
const desk = $('#desk'), deskList = $('#dk-list'), deskDetail = $('#dk-detail'), deskQ = $('#dk-q');
let selectedKey = null;
function guestRows() {
  const rows = new Map();
  for (const g of app.guests.values()) rows.set(g.key, { ...g });
  for (const a of app.alloc.values()) { const g = rows.get(a.key) || { key: a.key, name: a.name, email: a.email, source: a.source }; g.checkedInAt = g.checkedInAt || a.checkedInAt || a.at; g.alloc = a; rows.set(a.key, g); }
  const q = deskQ.value.trim().toLowerCase();

  if (q) list = list.filter(g => (g.name || '').toLowerCase().includes(q) || (g.email || '').toLowerCase().includes(q) || (g.alloc && g.alloc.codes.some(c => c.code.toLowerCase().includes(q))));
  list.sort((a, b) => (b.checkedInAt ? 1 : 0) - (a.checkedInAt ? 1 : 0) || (b.checkedInAt && a.checkedInAt ? new Date(b.checkedInAt) - new Date(a.checkedInAt) : 0) || (a.name || '').localeCompare(b.name || ''));
  return list;
}
function renderDesk() {

  const list = guestRows();
  deskList.innerHTML = list.slice(0, 300).map(g => `<div class="g-row${g.key === selectedKey ? ' sel' : ''}" data-key="${esc(g.key)}">
      <div><div class="g-name">${esc(g.name || g.email || 'Guest')}</div><div class="g-email">${esc(g.email || '')}</div></div>
      <span class="badge${g.checkedInAt ? ' in' : ''}">${g.checkedInAt ? 'in ' + fmtHM(g.checkedInAt) : 'registered'}</span>
      <span class="badge code">${g.alloc ? esc(codeTag(g.alloc)) : '—'}</span>${mailBadge(g.alloc)}</div>`).join('') || `<div class="dk-empty" style="padding:14px">no guests match</div>`;

}
function mailBadge(a) {
  const m = a && a.mail; if (!m || m.status === 'skipped') return '<span></span>';
  const cls = m.status === 'sent' || m.status === 'dry' ? ' in' : m.status === 'failed' ? ' bad' : '';
  return `<span class="badge${cls}">${m.status === 'sent' ? '✉ sent' : m.status === 'dry' ? '✉ dry' : m.status === 'failed' ? '✉ failed' : '✉ …'}</span>`;
}
function mailLine(a) {
  const m = a.mail;
  if (!app.email || !app.email.enabled) return 'delivery is off — set RESEND_API_KEY in .env and restart serve.mjs';
  if (!m) return 'not sent yet';
  if (m.status === 'sent') return `sent ${fmtHM(m.at)} to ${m.to}`;
  if (m.status === 'dry') return `dry run ${fmtHM(m.at)} → ${m.to}`;

function qrDataUrl(text) { try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createDataURL(6, 2); } catch { return ''; } }
function renderDetail(g) {
  if (!g) { deskDetail.innerHTML = `<div class="dk-empty">select a guest to see their credit code</div><div class="hint">keys: <kbd>D</kbd> toggle desk · <kbd>M</kbd> manual check-in · <kbd>F</kbd> fullscreen · <kbd>Esc</kbd> close</div>`; return; }

  if (a) {

    for (const cd of a.codes) {
      html += `<div class="d-code"><img alt="qr" src="${qrDataUrl(cd.url)}"><div><div class="p">${esc(app.labels[cd.pool] || cd.pool)} · #${pad3(codeIndex(cd))}</div><div class="c">${esc(cd.code)}</div><div class="u">${esc(cd.url)}</div>
        <div class="row"><button class="primary" data-copy="${esc(cd.url)}">copy link</button><button data-copy="${esc(cd.code)}">copy code</button></div></div></div>`;
    }

      html += `<div class="d-mail"><span class="p">email</span><span>${esc(mailLine(a))}</span>${canSend ? `<button data-mail="${esc(a.key)}">${a.mail && (a.mail.status === 'sent' || a.mail.status === 'dry') ? 'resend' : 'send now'}</button>` : ''}</div>`;
      html += `<div class="row"><button class="danger" data-release="${esc(a.key)}">release code</button><span class="hint" style="margin:0;align-self:center">returns the code to the pool; if the guest is still checked in they get re-allocated (and re-emailed) within seconds</span></div>`;
    }
  } else {
    html += `<div class="row"><button class="primary" data-checkin="${esc(g.key)}">check in + allocate credits</button></div><div class="hint">allocates the next unused referral code and plays the welcome on the wall.</div>`;

deskList.addEventListener('click', e => { const row = e.target.closest('.g-row'); if (!row) return; selectedKey = row.dataset.key; app.dirty = true; renderDesk(); });
deskDetail.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.copy) { try { await navigator.clipboard.writeText(b.dataset.copy); toast('copied'); } catch { toast('copy failed — select it manually'); } }
  if (b.dataset.release) {
    if (!confirm('Release this guest\'s code back to the pool? If they are still checked in, they will be re-allocated and emailed again.')) return;
    const r = await api('/release', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key: b.dataset.release }) });
    if (r.ok) { app.alloc.delete(b.dataset.release); const i = app.feed.findIndex(f => f.key === b.dataset.release); if (i >= 0) app.feed.splice(i, 1); toast('released'); } else toast('release failed');
    app.dirty = true; renderDesk(); setTimeout(syncState, 1500);
  }
  if (b.dataset.mail) {
    b.disabled = true; const r = await api('/email/send', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key: b.dataset.mail }) });
    toast(r.ok ? 'email queued' : 'could not queue email'); setTimeout(syncState, 1500); setTimeout(syncState, 4000); setTimeout(() => { app.dirty = true; renderDesk(); }, 1800);
  }
  if (b.dataset.checkin) { const g = app.guests.get(b.dataset.checkin); if (!g) return; g.checkedInAt = new Date().toISOString(); g.source = 'manual'; await ensureAllocated({ ...g, source: 'manual' }, { celebrate: true }); toast(`checked in ${g.name}`); app.dirty = true; renderDesk(); }
});
deskQ.addEventListener('input', () => { app.dirty = true; renderDesk(); });
function openDesk() { desk.hidden = false; app.dirty = true; renderDesk(); deskQ.focus(); }
function closeDesk() { desk.hidden = true; }
$('#dk-close').onclick = closeDesk;

function exportCsv() {
  const rows = [['name', 'email', 'checked_in_at', 'allocated_at', 'source', 'pool', 'code', 'url', 'email_status', 'emailed_at', 'email_to', 'email_error']];
  const mailCols = a => { const m = a.mail || {}; return [m.status || '', m.at || '', m.to || '', m.error || m.reason || '']; };
  for (const a of [...app.feed].reverse()) { if (!a.codes.length) rows.push([a.name, a.email, a.checkedInAt || '', a.at, a.source, '', '', '', ...mailCols(a)]); for (const c of a.codes) rows.push([a.name, a.email, a.checkedInAt || '', a.at, a.source, c.pool, c.code, c.url, ...mailCols(a)]); }
  const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `grokbot-credits-${new Date().toISOString().slice(0, 10)}.csv`; a.click();

const modal = $('#modal'), mdBox = $('#md-box');
function openModal(html) { mdBox.innerHTML = html; modal.hidden = false; const f = mdBox.querySelector('input,select'); if (f) f.focus(); }

modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

  openModal(`<h3>Manual check-in</h3><form id="mf"><div class="field"><label>name</label><input name="name" required autocomplete="off"></div><div class="field"><label>email (optional, used to match luma)</label><input name="email" type="email" autocomplete="off"></div>
    <div class="row"><button class="primary" type="submit">check in + allocate</button><button type="button" id="mf-cancel">cancel</button></div></form>`);

  $('#mf').onsubmit = async e => {

    const g = app.guests.get(key) || { key, id: key, name, email, approval: 'approved' };
    g.name = g.name || name; g.checkedInAt = g.checkedInAt || new Date().toISOString(); g.source = 'manual'; app.guests.set(key, g);

async function settingsModal() {

    ${app.server && app.email && app.email.enabled ? `<div class="field"><label>send a test email (fake code) to</label><div class="row" style="margin:0"><input id="sf-testto" type="email" placeholder="you@example.com" style="flex:1" autocomplete="off"><button type="button" id="sf-test">send test</button></div></div>` : ''}
    <div class="field"><label>poll interval (seconds)</label><input name="poll" type="number" min="2" max="60" value="${Math.round(app.config.pollMs / 1000)}"></div>
    <div class="field"><label>cell height px (text size, reloads)</label><input name="cell" type="number" min="12" max="40" value="${G.ch}"></div>
    <div class="row"><button class="primary" type="submit">save</button><button type="button" id="sf-cancel">cancel</button><span class="dk-spacer"></span><button type="button" class="danger" id="sf-reset">reset allocations</button></div>
    <div class="hint">pools: A = ${esc(app.labels.A)} (${app.poolTotals.A}) · B = ${esc(app.labels.B)} (${app.poolTotals.B}). state is ${app.persist ? 'stored on the server in data/state.json' : app.mode === 'demo' ? 'not saved (demo)' : 'stored in this browser only'}.</div></form>`);

    if (app.mode === 'luma') { fullRefreshAt = 0; syncLuma(); }

    e.preventDefault(); const fd = new FormData(e.target);
    const patch = { poolMode: String(fd.get('poolMode')), pollMs: clamp(Number(fd.get('poll')) || 5, 2, 60) * 1000 };
    if (app.luma) patch.eventId = String(fd.get('eventId') || '') || null;
    await pushConfig(patch);
    const cell = Number(fd.get('cell'));

let toastT = 0;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 1800); }
function showErr(msg) { const el = $('#err'); el.textContent = msg; el.hidden = !msg; }

document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) { if (e.key === 'Escape') { e.target.blur(); if (!modal.hidden) closeModal(); } return; }
  const k = e.key.toLowerCase();
  if (k === 'escape') { if (!modal.hidden) closeModal(); else if (!desk.hidden) closeDesk(); }
  else if (k === 'd' && DESK) { e.preventDefault(); desk.hidden ? openDesk() : closeDesk(); }
  else if (k === 'm' && DESK) { e.preventDefault(); if (desk.hidden) openDesk(); manualModal(); }
  else if (k === 'f') { e.preventDefault(); document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
  else if (k === ' ' && app.mode === 'demo' && desk.hidden) { e.preventDefault(); demoCheckIn(); }
  else if (k === 'e' && e.shiftKey && DESK) exportCsv();
});
let resizeT = 0;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(layoutGrid, 150); });

// =====================================================================
//  BOOT
// =====================================================================
async function boot() {
  layoutGrid();
  frame();
  // served over http(s): keep retrying /health rather than falling back to demo on a network blip
  let h = null;
  for (let attempt = 0; ; attempt++) {
    try { const r = await api('/health', { cache: 'no-store' }); if (r.status === 401) { showErr('Wall is locked — open it with ?key=… in the URL.'); return; } h = await r.json(); break; }
    catch { if (location.protocol === 'file:' || params.has('demo') || attempt >= 60) break; app.error = 'connecting to server…'; await new Promise(r => setTimeout(r, 3000)); }
  }
  if (h) { app.server = !!h.ok; app.luma = !!h.luma; app.poolTotals = h.pools || app.poolTotals; app.email = h.email || null; app.serverPolls = !!h.serverPolls; app.headline = h.eventName || ''; app.error = ''; }
  else app.server = false;
  const demo = params.has('demo') || (!app.server && !params.has('manual')) || (app.server && !app.luma && !params.has('manual'));
  app.persist = app.server && !demo;
  if (app.persist) await syncState(); else if (!demo) loadLocal();
  for (const a of app.alloc.values()) if (!app.feed.includes(a)) app.feed.push(a);
  app.feed.sort((x, y) => new Date(y.checkedInAt || y.at) - new Date(x.checkedInAt || x.at));
  if (demo) {
    app.mode = 'demo'; seedDemo();
    const burstN = Number(params.get('burst') || 0);
    for (let i = 0; i < burstN; i++) setTimeout(demoCheckIn, 200 + i * 400);
    scheduleDemo();
  } else if (!app.luma) {
    app.mode = 'manual';
  } else {
    app.mode = 'luma';
    if (app.serverPolls) { await syncState(); if (DESK) { const loadGuests = async () => { try { for (const g of (await (await api('/guests')).json()).guests || []) app.guests.set(g.key, { ...g, source: 'luma' }); app.dirty = true; } catch {} }; loadGuests(); setInterval(loadGuests, 30000); } }
    else try {
      const ev = await resolveEvent(); app.eventId = ev.id; app.eventName = ev.name || ''; app.eventStart = ev.start_at;
      const gc = ev.guest_counts && ev.guest_counts.approved; if (gc) app.total = gc.guests || 0;
      await syncLuma();
      const tick = async () => { await syncLuma(); setTimeout(tick, app.config.pollMs); }; setTimeout(tick, app.config.pollMs);
    } catch (e) { app.error = e.message; showErr('Luma: ' + e.message + ' — press D → settings to pick an event, or add ?demo to the URL.'); }
  }
  app.initial = false;
  if (app.persist) setInterval(syncState, app.serverPolls ? 2000 : 4000);
  document.documentElement.style.setProperty('--accent', accent().main);
  app.dirty = true;
  if (params.has('style')) { setStyle(Number(params.get('style')) || 0, nowS(), 0.01); if (params.has('hold')) morph.hold = true; }
  if (params.has('color')) { colorIdx = clamp(Number(params.get('color')) || 0, 0, BRAND.length - 1); document.documentElement.style.setProperty('--accent', accent().main); }
  if (params.get('modal') === 'manual') { openDesk(); manualModal(); }
  if (params.get('modal') === 'settings') { openDesk(); settingsModal(); }
  if (params.has('desk')) { openDesk(); const first = guestRows()[0]; if (first) { selectedKey = first.key; renderDesk(); } }
}
boot().catch(e => showErr(String(e.stack || e)));
